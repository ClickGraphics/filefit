<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">FileFit — Comprime y redimensiona imágenes</title>
<desc id="desc">Tarjeta social de FileFit, herramienta gratuita con procesamiento local para comprimir y redimensionar imágenes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#10233a"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#75f0c3"/><stop offset="1" stop-color="#5fd6ff"/></linearGradient>
</defs>
<rect width="1200" height="630" rx="36" fill="url(#bg)"/>
<rect x="70" y="66" width="68" height="68" rx="18" fill="url(#accent)"/>
<text x="104" y="113" text-anchor="middle" font-family="Arial,sans-serif" font-size="40" font-weight="900" fill="#06131d">F</text>
<text x="158" y="113" font-family="Arial,sans-serif" font-size="43" font-weight="800" fill="#f6f8fb">File<tspan fill="#75f0c3">Fit</tspan></text>
<text x="70" y="220" font-family="Arial,sans-serif" font-size="64" font-weight="850" fill="#f6f8fb">Comprime y</text>
<text x="70" y="292" font-family="Arial,sans-serif" font-size="64" font-weight="850" fill="url(#accent)">redimensiona imágenes</text>
<text x="70" y="350" font-family="Arial,sans-serif" font-size="28" fill="#c6d2e0">Ajusta formato, dimensiones y peso máximo.</text>
<text x="70" y="392" font-family="Arial,sans-serif" font-size="28" fill="#c6d2e0">Gratis, sin registro y sin subir tus archivos.</text>
<g transform="translate(70 474)" font-family="Arial,sans-serif">
  <rect width="300" height="82" rx="18" fill="#0e1929" stroke="#24344b"/>
  <text x="26" y="35" font-size="21" font-weight="700" fill="#75f0c3">🔒 Privado</text>
  <text x="26" y="61" font-size="16" fill="#9eacc0">Procesamiento local</text>
  <rect x="320" width="300" height="82" rx="18" fill="#0e1929" stroke="#24344b"/>
  <text x="346" y="35" font-size="21" font-weight="700" fill="#75f0c3">⚡ Rápido</text>
  <text x="346" y="61" font-size="16" fill="#9eacc0">Todo en el navegador</text>
  <rect x="640" width="300" height="82" rx="18" fill="#0e1929" stroke="#24344b"/>
  <text x="666" y="35" font-size="21" font-weight="700" fill="#75f0c3">✓ Gratis</text>
  <text x="666" y="61" font-size="16" fill="#9eacc0">Sin cuentas ni pagos</text>
</g>
